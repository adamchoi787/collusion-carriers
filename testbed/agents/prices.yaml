# Price table for the spend guard (testbed/agents/budget.py).
#
# USD per million tokens. `cached` is the price of a cache-read input token;
# null means "unknown", and the guard then charges the full input price.
# Seeded from a web lookup on 24 Oct 2026. Every row is `verify: true`:
# CHECK THE OFFICIAL PRICING PAGE (`source`) BEFORE ANY LARGE RUN.
#
# A model that is not listed here cannot be called: the guard refuses to
# estimate its cost. Add a row (with a source) before using a new model.
#
# The ledger is in USD. Keys funded in RMB (DeepSeek, Moonshot China) are billed
# from CNY price lists that may differ from these USD figures; see each provider.
#
# Estimates are conservative on purpose: off-peak discounts (DeepSeek) and
# cache reads are ignored when reserving, and output is reserved at the full
# max_tokens of the call. Actual cost is settled from the returned usage.

as_of: "2026-10-24"

providers:
  anthropic:
    key_env: ANTHROPIC_API_KEY
    base_url: null                       # official SDK default
    cache_write_multiplier: 1.25         # 5-minute cache writes cost 1.25x input
    models:
      claude-haiku-5-5:
        input: 0.10
        output: 0.50
        cached: 0.01
        note: "Prompts up to 100K tokens; $0.50 / $2.50 beyond (cache hit $0.05). The guard does not model the long-prompt tier, so keep prompts under 100K. Checked against the pricing page 24 Oct 2026."
        verify: true
        source: "https://platform.claude.com/docs/en/about-claude/pricing"
      claude-sonnet-5-5:
        input: 2.00
        output: 10.00
        cached: 0.10
        note: "Cache hits are 0.05x input (pricing page, 24 Oct 2026)."
        verify: true
        source: "https://platform.claude.com/docs/en/about-claude/pricing"
      claude-opus-5-5:
        input: 4.00
        output: 20.00
        cached: 0.20
        verify: true
        source: "https://platform.claude.com/docs/en/about-claude/pricing"

  openai:
    key_env: OPENAI_API_KEY
    base_url: null                       # official SDK default
    models:
      gpt-6-luna:
        input: 0.10
        output: 0.50
        cached: 0.01
        note: "Standard tier, prompts up to 272K tokens. Checked against the pricing page 24 Oct 2026."
        verify: true
        source: "https://developers.openai.com/api/docs/pricing"
      gpt-5.6-luna:
        input: 0.20
        output: 1.20
        cached: 0.02
        verify: true
        source: "https://developers.openai.com/api/docs/pricing"
      gpt-5-nano:
        input: 0.05
        output: 0.40
        cached: 0.005
        note: "Cheapest per token on the page (24 Oct 2026), but an older generation than gpt-6-luna."
        verify: true
        source: "https://developers.openai.com/api/docs/pricing"
      gpt-6-sol:
        input: 2.00
        output: 10.00
        cached: 0.20
        verify: true
        source: "https://developers.openai.com/api/docs/pricing"

  moonshot:
    key_env: MOONSHOT_API_KEY
    # Default is the China platform (RMB-funded key); override with MOONSHOT_BASE_URL
    # (international: https://api.moonshot.ai/v1). The guard charges the USD figures
    # below; the CNY price list (platform.kimi.com/docs/pricing/chat) did not render
    # on 24 Oct 2026, so the RMB deduction is unchecked. K2 models close to new
    # users on 31 Oct 2026 and go offline end of Dec 2026.
    base_url: "https://api.moonshot.cn/v1"
    models:
      kimi-k2.6:
        input: 0.95
        output: 4.00
        cached: 0.16
        note: "ID confirmed by the model list (api.moonshot.cn, 24 Oct 2026). kimi-k3.1-pro is listed but unpriced here."
        verify: true
        source: "https://platform.kimi.ai/docs/pricing"
      kimi-k3:
        input: 3.00
        output: 15.00
        cached: 0.30
        note: "Thinking always on."
        verify: true
        source: "https://platform.kimi.ai/docs/pricing"

  deepseek:
    key_env: DEEPSEEK_API_KEY
    base_url: "https://api.deepseek.com"     # api-docs.deepseek.com (24 Oct 2026); same for RMB accounts
    # CNY list (api-docs.deepseek.com/zh-cn/quick_start/pricing, 24 Oct 2026), peak:
    # deepseek-flash 2 / 8 RMB per M (cache hit 0.04), deepseek-v4-pro 9 / 27 RMB.
    # At ~7.1 RMB/USD the USD rows below are equal or slightly higher, so the
    # USD ledger is conservative for RMB-funded keys.
    models:
      deepseek-flash:
        input: 0.30
        output: 1.20
        cached: 0.006
        note: "V4.1-flash; the docs say `deepseek-flash` is served by DeepSeek-V4.1-Flash-1017. Off-peak is half price; the guard ignores the discount."
        verify: true
        source: "https://api-docs.deepseek.com/quick_start/pricing"
      deepseek-v4-pro:
        input: 1.32
        output: 3.96
        cached: null
        verify: true
        source: "https://api-docs.deepseek.com/quick_start/pricing"

  minimax:
    key_env: MINIMAX_API_KEY
    base_url: "https://api.minimax.io/v1"    # platform.minimax.io OpenAI-compatible docs (24 Oct 2026)
    # The key is a Coding Plan subscription; the user approved using it here
    # (24 Oct 2026). The plan bills by subscription, not per token, so the guard's
    # charges at the pay-as-you-go prices below are a conservative stand-in.
    models:
      MiniMax-M3:
        input: 0.30
        output: 1.20
        cached: 0.03
        note: "M2/M3 pay-as-you-go figure."
        verify: true
        source: "https://platform.minimax.io/docs/pricing"
      MiniMax-M3.1-Flash:
        input: 0.30
        output: 1.20
        cached: 0.03
        note: "Price assumed equal to M3 (no separate figure found). Always thinks; reasoning_effort defaults to max."
        verify: true
        source: "https://platform.minimax.io/docs/pricing"

  vllm:
    # Open-weight models served by testbed/serve_vllm.py on Modal GPUs. Tokens cost
    # $0 here so API spend stays separate; the GPU time is Modal compute (below),
    # recorded by the serving containers. No cap is needed (budget.SELF_HOSTED).
    key_env: VLLM_API_KEY
    base_url: null                       # VLLM_BASE_URL, else the deployed endpoint per model
    self_hosted: true
    models:
      Qwen/Qwen3.8-27B-FP8:
        input: 0.0
        output: 0.0
        cached: 0.0
        note: "Alibaba Qwen3.8 27B dense, official FP8 weights, Apache-2.0. Served on an L40S."
        verify: true
        source: "https://huggingface.co/Qwen/Qwen3.8-27B-FP8"
      google/gemma-4-26B-A4B-it:
        input: 0.0
        output: 0.0
        cached: 0.0
        note: "Google Gemma 4 26B MoE (4B active), BF16 as released, Apache-2.0. Served on an A100-80GB."
        verify: true
        source: "https://huggingface.co/google/gemma-4-26B-A4B-it"

# Modal compute, for the compute half of `python -m testbed.agents.spend`.
# USD per second. Checked against https://modal.com/pricing on 24 Oct 2026.
modal:
  cpu_core_second: 0.0000131
  memory_gib_second: 0.00000222
  gpu_second:                          # per GPU, on top of the container's CPU and memory
    T4: 0.000164                       # $0.59/h
    L4: 0.000222                       # $0.80/h
    A10: 0.000306                      # $1.10/h
    L40S: 0.000542                     # $1.95/h
    A100-40GB: 0.000583                # $2.10/h
    A100-80GB: 0.000694                # $2.50/h
    H100: 0.001097                     # $3.95/h
    H200: 0.001261                     # $4.54/h
    B200: 0.001736                     # $6.25/h
  # Volume storage: the serve_vllm weights (~83 GiB for both models) cost ~$7.5 a month
  # while they stay on the `collusion-models` Volume. Not tracked by the ledger.
  volume_gib_month: 0.09
  verify: true
  source: "https://modal.com/pricing"

